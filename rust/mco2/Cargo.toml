[package]
name = "data-analysis-pipeline-project"
version = "1.0.0"
edition = "2024"
description = "A program that analyses a CSV file and generates reports from it."
repository = "https://github.com/seoyunnie/csadprg-mcos.git"
categories = ["encoding", "parsing", "simulation"]

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4.0"
itertools = "0.14.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
thousands = "0.2.0"
